name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Cache Maven repository
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('project.clj') }}
        restore-keys: |
          ${{ runner.os }}-m2-
    
    - name: Install Leiningen
      run: |
        wget https://raw.githubusercontent.com/technomancy/leiningen/2.11.2/bin/lein
        chmod +x lein
        sudo mv lein /usr/local/bin/
        lein version
    
    - name: Install dependencies
      run: lein deps
    
    - name: Run tests
      run: lein test
    
    - name: Build uberjar
      run: lein uberjar
